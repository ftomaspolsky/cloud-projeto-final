<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendente do condomínio</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; background: #efeae2; font: 15px/1.4 system-ui, sans-serif; color: #111b21; }
  header { background: #075e54; color: #fff; padding: 14px 16px; font-weight: 600; }
  header small { display: block; font-weight: 400; opacity: .85; }
  #conversa { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .balao { max-width: 80%; padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; background: #fff; align-self: flex-start; }
  .balao.morador { background: #d9fdd3; align-self: flex-end; }
  .balao.sistema { background: #fff3c4; align-self: center; }
  #menu { background: #fff; padding: 12px; border-radius: 8px; display: grid; gap: 8px; align-self: stretch; }
  #menu label { display: grid; gap: 2px; font-size: 13px; }
  select, input, button { font: inherit; padding: 8px; border: 1px solid #c8c8c8; border-radius: 6px; }
  button { background: #075e54; color: #fff; border: 0; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  form#envio { display: flex; gap: 8px; padding: 10px; background: #f0f2f5; }
  form#envio input { flex: 1; }
</style>
</head>
<body>
<header>Atendente do condomínio<small>Residencial Exemplo · unidade 101</small></header>
<main id="conversa" aria-live="polite"></main>
<form id="envio">
  <input id="texto" maxlength="2000" autocomplete="off" required placeholder="Ex.: reserva o salão sábado à noite" aria-label="Mensagem">
  <button id="enviar">Enviar</button>
</form>
<script>
  const conversa = document.getElementById("conversa");
  const texto = document.getElementById("texto");
  const enviar = document.getElementById("enviar");
  const NOMES_DOS_PERIODOS = { manha: "Manhã", tarde: "Tarde", noite: "Noite" };
  let conversaId = null;

  function balao(conteudo, classe) {
    const elemento = document.createElement("div");
    elemento.className = "balao " + (classe || "");
    elemento.textContent = conteudo;
    conversa.appendChild(elemento);
    conversa.scrollTop = conversa.scrollHeight;
  }

  function campo(rotulo, controle) {
    const label = document.createElement("label");
    label.textContent = rotulo;
    label.appendChild(controle);
    return label;
  }

  function opcoes(lista) {
    const select = document.createElement("select");
    for (const [valor, nome] of lista) {
      select.add(new Option(nome, valor));
    }
    return select;
  }

  async function mostrarMenu() {
    if (document.getElementById("menu")) return;
    const resposta = await fetch("/menu/areas");
    if (!resposta.ok) {
      balao("O sistema está indisponível. Tente de novo em instantes.", "sistema");
      return;
    }
    const { areas, periodos } = await resposta.json();

    const area = opcoes(areas.map(a => [a.nome, `${a.nome} (R$ ${a.taxa})`]));
    const data = document.createElement("input");
    data.type = "date";
    data.required = true;
    const periodo = opcoes(periodos.map(p => [p, NOMES_DOS_PERIODOS[p] || p]));
    const botao = document.createElement("button");
    botao.textContent = "Reservar";

    const menu = document.createElement("form");
    menu.id = "menu";
    menu.append(campo("Área", area), campo("Data", data), campo("Período", periodo), botao);
    menu.addEventListener("submit", async evento => {
      evento.preventDefault();
      botao.disabled = true;
      const resultado = await fetch("/menu/reservas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ area: area.value, data: data.value, periodo: periodo.value }),
      });
      const corpo = await resultado.json();
      if (resultado.ok) {
        balao(`Reserva registrada: ${corpo.area}, ${corpo.data}, período ${corpo.periodo}, taxa de R$ ${corpo.taxa}.`);
        menu.remove();
      } else {
        balao(`Não foi possível reservar (${corpo.recusada || corpo.erro}).`, "sistema");
        botao.disabled = false;
      }
    });
    conversa.appendChild(menu);
    conversa.scrollTop = conversa.scrollHeight;
  }

  document.getElementById("envio").addEventListener("submit", async evento => {
    evento.preventDefault();
    const mensagem = texto.value.trim();
    if (!mensagem) return;
    balao(mensagem, "morador");
    texto.value = "";
    enviar.disabled = true;
    try {
      const resposta = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensagem, conversa_id: conversaId }),
      });
      const corpo = await resposta.json();
      if (corpo.conversa_id) conversaId = corpo.conversa_id;
      balao(corpo.resposta || "O sistema está indisponível. Tente de novo em instantes.", resposta.ok ? "" : "sistema");
      if (corpo.modo === "menu") await mostrarMenu();
    } catch {
      balao("Sem conexão com o sistema. Tente de novo.", "sistema");
    } finally {
      enviar.disabled = false;
      texto.focus();
    }
  });

  balao("Olá! Posso consultar a disponibilidade e reservar as áreas comuns. O que você precisa?");
</script>
</body>
</html>
