# ElasticMQ: um SQS compatível que roda local. Mesma topologia da AWS:
# a fila de eventos manda para a DLQ depois de 3 recebimentos sem sucesso.
include classpath("application.conf")

queues {
  eventos {
    defaultVisibilityTimeout = 10 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "eventos-dlq"
      maxReceiveCount = 3
    }
  }
  eventos-dlq { }
}
