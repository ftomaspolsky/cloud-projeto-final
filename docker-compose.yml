# Ambiente local: os dois serviços + MySQL + um SQS local (ElasticMQ) + um Bedrock simulado.
# Serve para desenvolver sem AWS. A topologia é a mesma que vai para o ECS.
#   cp .env.example .env
#   docker compose up --build
#   docker compose --profile teste run --rm --build testes

x-aws-local: &aws-local
  AWS_REGION: us-east-2
  AWS_ACCESS_KEY_ID: local          # os simulados não conferem credencial
  AWS_SECRET_ACCESS_KEY: local
  SQS_ENDPOINT_URL: http://elasticmq:9324
  QUEUE_NAME: eventos

x-modelo: &modelo
  BEDROCK_ENDPOINT_URL: http://bedrock-fake:9000
  BEDROCK_MODEL_ID: us.anthropic.claude-haiku-5-5

x-db: &db
  DB_HOST: mysql
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

services:
  mysql:
    image: mysql:8.4                # a mesma linha do RDS em Ohio
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.9
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "9324:9324"

  bedrock-fake:
    build: ./local/bedrock-fake

  atendimento:
    build: ./app/atendimento
    environment:
      <<: [*aws-local, *modelo, *db]
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      elasticmq:
        condition: service_started
      bedrock-fake:
        condition: service_started

  operacoes:
    build: ./app/operacoes
    environment:
      <<: [*aws-local, *db]
    depends_on:
      mysql:
        condition: service_healthy
      elasticmq:
        condition: service_started

  testes:
    profiles: ["teste"]
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      <<: [*aws-local, *modelo, *db]
    depends_on:
      atendimento:
        condition: service_started
      operacoes:
        condition: service_started
